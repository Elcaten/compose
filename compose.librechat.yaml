name: "LibreChat"

services:
  api:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.multi
    #   target: api-build
    image: ghcr.io/danny-avila/librechat-api:v0.8.8-rc3
    container_name: librechat-api
    networks:
      - proxy-librechat
      - librechat-mongodb
      - librechat-meilisearch
      - librechat-rag
      - librechat-prowlarr
      - librechat-wolt
    # ports:
    #   - 3080:3080
    depends_on:
      - mongodb
      - rag_api
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - /root/data/librechat/config/.env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    volumes:
      - type: bind
        source: /root/data/librechat/config/librechat.yaml
        target: /app/librechat.yaml
      - /root/data/librechat/data/images:/app/client/public/images
      - /root/data/librechat/data/logs:/app/api/logs

  mongodb:
    container_name: librechat-mongodb
    networks:
      - librechat-mongodb
    # ports:  # Uncomment this to access mongodb from outside docker, not safe in deployment
    #   - 27018:27017
    image: mongo:8.3.11-noble
    restart: always
    volumes:
      - /root/data/librechat/data/data-node:/data/db
    command: mongod --noauth

  meilisearch:
    container_name: librechat-meilisearch
    networks:
      - librechat-meilisearch
    image: getmeili/meilisearch:v1.54.3
    restart: always
    # ports: # Uncomment this to access meilisearch from outside docker
    #   - 7700:7700 # if exposing these ports, make sure your master key is not the default value
    env_file:
      - /root/data/librechat/config/.env
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    volumes:
      # Keep the directory version aligned with the image; upgrades require a new directory and reindex.
      - /root/data/librechat/data/meili_data_v1.35.1:/meili_data

  vectordb:
    image: ankane/pgvector:v0.5.1
    container_name: librechat-vectordb
    networks:
      - rag-vectordb
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - /root/data/librechat/data/postgress:/var/lib/postgresql/data

  rag_api:
    container_name: librechat-rag-api
    networks:
      - librechat-rag
      - rag-vectordb
      - rag-egress
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.9.0
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - /root/data/librechat/config/.env
