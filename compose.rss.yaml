name: "RSS"

services:
  freshrss:
    image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
    container_name: freshrss
    networks:
      - proxy-freshrss
    logging:
      options:
        max-size: 10m
    volumes:
      - /root/data/freshrss/data:/var/www/FreshRSS/data
      - /root/data/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: Europe/Paris
      CRON_MIN: "3,33"
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub:latest@sha256:26554b9793c73aaffc7d8b086cd53a7a8fba64c3b3b3ef5be26b9442592a3cdf
    container_name: rsshub
    networks:
      - proxy-rsshub
    restart: unless-stopped
    env_file:
      - ./.env.rss
