name: "RSS"

services:
  freshrss:
    image: freshrss/freshrss@sha256:a4a4a2233c082940b3ed5a32e2bf12d6c5271062be7e34c188dec99816540fc4
    container_name: freshrss
    networks:
      - proxy-freshrss
      - freshrss-rss-bridge
    logging:
      options:
        max-size: 10m
    volumes:
      - /root/data/freshrss/data:/var/www/FreshRSS/data
      - /root/data/freshrss/extensions:/var/www/FreshRSS/extensions
    env_file:
      - ./.env.rss
    environment:
      TZ: Europe/Paris
      CRON_MIN: "3,33"
      INTERNAL_HOST_ALLOWLIST: "rss-bridge:80"
    restart: unless-stopped

  rss-bridge:
    image: rssbridge/rss-bridge@sha256:fcd6ac6335ef0e4f4688b41244e925735195bd41df70808d27d891910f2c0be8
    container_name: rss-bridge
    networks:
      - freshrss-rss-bridge
      - rss-bridge-egress
    volumes:
      - /root/data/rss-bridge:/config
    env_file:
      - ./.env.rss
    restart: unless-stopped
