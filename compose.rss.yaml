name: "RSS"

services:
  freshrss:
    image: freshrss/freshrss@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
    container_name: freshrss
    networks:
      - proxy-freshrss
      - freshrss-rss-bridge
    logging:
      options:
        max-size: 10m
    volumes:
      - /root/data/freshrss/data:/var/www/FreshRSS/data
      - /root/data/freshrss/extensions:/var/www/FreshRSS/extensions
    env_file:
      - ./.env.rss
    environment:
      TZ: Europe/Paris
      CRON_MIN: "3,33"
      INTERNAL_HOST_ALLOWLIST: "rss-bridge:80"
    restart: unless-stopped

  rss-bridge:
    image: rssbridge/rss-bridge@sha256:8e84691e08d20120fb1bf3f563dd6395632f02932ff29a0cfd20133c0004ee05
    container_name: rss-bridge
    networks:
      - freshrss-rss-bridge
      - rss-bridge-egress
    volumes:
      - /root/data/rss-bridge:/config
    env_file:
      - ./.env.rss
    restart: unless-stopped
