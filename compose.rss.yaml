name: "RSS"

services:
  freshrss:
    image: freshrss/freshrss@sha256:a4a4a2233c082940b3ed5a32e2bf12d6c5271062be7e34c188dec99816540fc4
    container_name: freshrss
    networks:
      - proxy-freshrss
    logging:
      options:
        max-size: 10m
    volumes:
      - /root/data/freshrss/data:/var/www/FreshRSS/data
      - /root/data/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: Europe/Paris
      CRON_MIN: "3,33"
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    networks:
      - proxy-rsshub
    restart: unless-stopped
    env_file:
      - ./.env.rss
