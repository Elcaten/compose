name: "RSS"

services:
  freshrss:
    image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
    container_name: freshrss
    networks:
      - proxy-freshrss
    logging:
      options:
        max-size: 10m
    volumes:
      - /root/data/freshrss/data:/var/www/FreshRSS/data
      - /root/data/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: Europe/Paris
      CRON_MIN: "3,33"
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub:latest@sha256:a9ebb6897f510b188e6fb93e812c3ca16a527d941076e6bdd6c51507b703c7de
    container_name: rsshub
    networks:
      - proxy-rsshub
    restart: unless-stopped
    env_file:
      - ./.env.rss
