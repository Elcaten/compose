name: "RSS"

services:
  freshrss:
    image: freshrss/freshrss@sha256:48b63b9bc3d042a1301c32971b01af8841c7f059b452589c5bf77f475ba44c61
    container_name: freshrss
    networks:
      - proxy-freshrss
      - freshrss-rss-bridge
    logging:
      options:
        max-size: 10m
    volumes:
      - /root/data/freshrss/data:/var/www/FreshRSS/data
      - /root/data/freshrss/extensions:/var/www/FreshRSS/extensions
    env_file:
      - ./.env.rss
    environment:
      TZ: Europe/Paris
      CRON_MIN: "3,33"
      INTERNAL_HOST_ALLOWLIST: "rss-bridge:80"
    restart: unless-stopped

  rss-bridge:
    image: rssbridge/rss-bridge@sha256:918fbcace198a97c6eb72cc4f79a5cbdb65a3d151d22174e0778a92f4b4ea116
    container_name: rss-bridge
    networks:
      - freshrss-rss-bridge
      - rss-bridge-egress
    volumes:
      - /root/data/rss-bridge:/config
    env_file:
      - ./.env.rss
    restart: unless-stopped
