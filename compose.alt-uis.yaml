name: "Alternative UIs"

services:
  social-preview:
    container_name: social-preview
    build:
      context: /root/src/social-preview
    env_file: .env.alt-uis
    restart: unless-stopped
    networks:
      - proxy-social-preview
    volumes:
      - /root/data/social-preview/data:/rails/storage
      - /root/data/social-preview/downloads:/rails/storage/media

  iSponsorBlockTV:
    container_name: iSponsorBlockTV
    networks:
      - isponsorblocktv-egress
    image: ghcr.io/dmunozv04/isponsorblocktv@sha256:d1e876636754fb2b54490feebe3af4a321f7f2a932a2d57b67b2a667eea40823
    restart: unless-stopped
    volumes:
      - /root/data/iSponsorBlockTV:/app/data
