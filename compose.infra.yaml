name: "Infra"

services:
  caddy:
    build:
      context: /root/data/caddy
    container_name: caddy
    restart: unless-stopped
    networks:
      - proxy-authelia
      - proxy-librechat
      - proxy-redlib
      - proxy-freshrss
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /root/data/caddy/Caddyfile:/etc/caddy/Caddyfile
      - /root/data/caddy/data:/data
      - /root/data/caddy/config:/config
      - /root/data/caddy/logs:/var/log/caddy
      - /root/data/caddy/cloudflare:/etc/cloudflare

  authelia:
    container_name: authelia
    image: docker.io/authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    restart: "unless-stopped"
    depends_on:
      - redis
    networks:
      - proxy-authelia
      - authelia-redis
    volumes:
      - /root/data/authelia:/config

  redis:
    image: redis@sha256:718f745deb7dfefeac6eed7041fc7ec9476b50e61b247932682457c41adafa0e
    restart: unless-stopped
    container_name: redis
    networks:
      - authelia-redis
    volumes:
      - /root/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  borgmatic:
    image: ghcr.io/borgmatic-collective/borgmatic@sha256:f57f5ce0af50819024a9a57bc54904260118a6481c650e26c985b63138d3ba29
    container_name: borgmatic
    networks:
      - borgmatic-egress
    volumes:
      - /root/data:/mnt/source/data:ro
      - /root/data/borgmatic/borgmatic.d:/etc/borgmatic.d:ro
      - /root/data/borgmatic/.config/borg:/root/.config/borg
      - /root/data/borgmatic/.ssh:/root/.ssh:ro
      - /root/data/borgmatic/.cache/borg:/root/.cache/borg
      - /root/data/borgmatic/.local/state/borgmatic:/root/.local/state/borgmatic
    tmpfs:
      - /run/borgmatic-runtime:mode=0700
    environment:
      - TZ=Europe/Berlin
      # Keep lock ownership stable when this container is recreated.
      - BORG_HOST_ID=03bc3da3-b785-4e59-9066-4790c4e9a896
      # Use a stable neutral name in archive names and metadata.
      - BORG_HOSTNAME=backup-client-03bc3da3
    stop_grace_period: 1m
    restart: unless-stopped
